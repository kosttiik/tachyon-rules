name: Update routing rules

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-aws-rules.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: update-aws-game-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Test source filtering and SRS validation
        run: python -m unittest discover -s tests -v
      - name: Install latest stable sing-box and verify release checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, tarfile, urllib.request
          request = urllib.request.Request(
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)
          version = release["tag_name"].removeprefix("v")
          if release["prerelease"] or not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise ValueError("Expected a stable sing-box release")
          name = f"sing-box-{version}-linux-amd64.tar.gz"
          asset = next(a for a in release["assets"] if a["name"] == name)
          with urllib.request.urlopen(asset["browser_download_url"], timeout=60) as response:
              archive = response.read()
          if asset.get("digest") != "sha256:" + hashlib.sha256(archive).hexdigest():
              raise ValueError("sing-box archive checksum mismatch or missing digest")
          import io
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sing-box-bin"
          target.mkdir()
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tar:
              member = tar.getmember(f"sing-box-{version}-linux-amd64/sing-box")
              if not member.isfile():
                  raise ValueError("Expected a regular sing-box binary")
              (target / "sing-box").write_bytes(tar.extractfile(member).read())
          (target / "sing-box").chmod(0o755)
          with open(os.environ["GITHUB_PATH"], "a") as path:
              path.write(str(target) + "\n")
          print(f"Installed sing-box {version} with verified SHA256")
          PY
      - name: Refresh selected AWS prefixes and rebuild changed list
        run: |
          sing-box version
          python - <<'PYCODE'
          import json, os, pathlib, subprocess
          from scripts.update_rules import verify_roundtrip
          target = pathlib.Path(os.environ["RUNNER_TEMP"])
          subprocess.run(["sing-box", "rule-set", "compile", "games/aws-udp.json", "-o", str(target / "check.srs")], check=True)
          subprocess.run(["sing-box", "rule-set", "decompile", str(target / "check.srs"), "-o", str(target / "check.json")], check=True)
          verify_roundtrip(json.loads((target / "check.json").read_text()), json.loads(pathlib.Path("games/aws-udp.json").read_text()))
          PYCODE
          python scripts/update_rules.py
          sha256sum --check SHA256SUMS
      - name: Refresh YouTube and scoped Discord rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/update_services.py
          sha256sum --check services/SHA256SUMS
      - name: Commit changed rules
        run: |
          git add games/ sources.json SHA256SUMS services/
          if git diff --cached --quiet; then
            echo "No selected prefix changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update routing rule sources'
          git push origin HEAD:main
